{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.gotosocial_container_name, "image") %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}

{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/"}) %}

{% do c1.environment.add_env("GTS_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("GTS_HOST", values.gotosocial.host) %}
{% do c1.environment.add_env("GTS_DB_TYPE", "sqlite") %}
{% do c1.environment.add_env("GTS_DB_ADDRESS", "/data/sqlite.db") %}
{% do c1.environment.add_env("GTS_TRUSTED_PROXIES", values.gotosocial.trusted_proxies) %}
{% do c1.environment.add_env("GTS_LETSENCRYPT_ENABLED", "false") %}
{% do c1.environment.add_env("GTS_LETSENCRYPT_EMAIL_ADDRESS", "") %}
{% do c1.environment.add_user_envs(values.gotosocial.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "http", "path": "/"}) %}

{{ tpl.render() | tojson }}
